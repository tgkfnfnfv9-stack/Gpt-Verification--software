name: phase9-exploratory-fxcm-blind-mtf-batch6-count-only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_EXPLORATORY_FXCM_BLIND_MTF_BATCH6_COUNT_ONLY_2017_2018_V1'
        required: true
        type: string
      usage_confirmation:
        description: 'Type I_CONFIRM_PERSONAL_NONCOMMERCIAL_USE_AND_ACCEPT_FXCM_EULA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  count-only:
    if: >-
      ${{ false &&
          github.repository == 'tgkfnfnfv9-stack/Gpt-Verification--software' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirmation == 'RUN_EXPLORATORY_FXCM_BLIND_MTF_BATCH6_COUNT_ONLY_2017_2018_V1' &&
          inputs.usage_confirmation == 'I_CONFIRM_PERSONAL_NONCOMMERCIAL_USE_AND_ACCEPT_FXCM_EULA' &&
          github.run_number == 1 &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify Batch 6 preregistration and no-rescue boundary
        shell: bash
        run: |
          set -euo pipefail
          track='research/phase9-exploratory-fxcm-20260901'
          test "$GITHUB_RUN_NUMBER" = '1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(sha256sum "$track/spec/fxcm_blind_mtf_candidates_v6.frozen.json" | cut -d' ' -f1)" = 'da49f0f061a5ed6edc90effa232114742900ef316b19a953fd74143113566460'
          test "$(sha256sum "$track/runner/fxcm_blind_mtf_count_only_v6.py" | cut -d' ' -f1)" = '082071317dd9a6d555beda75a44abfcdeaea2c73b0f202fa8ad7b7d20de39685'
          test "$(sha256sum "$track/results/run-33610462879/BLIND_MTF_BATCH5_RETURN_OOS_INDEPENDENT_AUDIT.json" | cut -d' ' -f1)" = '319c543cb1630622e46d4f759b856e080a4a1c5b26763475eeb575afc08d5545'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s "$track/tests" -p 'test_*.py'
          test -z "$(git status --porcelain)"

      - name: Reacquire and reconstruct canonical ephemeral 64-series MTF data
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          track='research/phase9-exploratory-fxcm-20260901'
          work="$RUNNER_TEMP/phase9-batch6-count-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mtf_report="$RUNNER_TEMP/phase9-batch6-count-qc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          count_report="$RUNNER_TEMP/phase9-batch6-count-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PHASE9_BATCH6_COUNT_WORK=$work" >> "$GITHUB_ENV"
          echo "PHASE9_BATCH6_COUNT_QC=$mtf_report" >> "$GITHUB_ENV"
          echo "PHASE9_BATCH6_COUNT_RESULT=$count_report" >> "$GITHUB_ENV"
          command=(
            python "$track/runner/fxcm_multitimeframe_qc.py"
            --confirmation RUN_EXPLORATORY_FXCM_FX8_MTF_2017_2018_QC_ONLY_V1
            --usage-confirmation I_CONFIRM_PERSONAL_NONCOMMERCIAL_USE_AND_ACCEPT_FXCM_EULA
            --contract "$track/spec/fxcm_multitimeframe_data_requirements.frozen.json"
            --execution-contract "$track/spec/fxcm_multitimeframe_execution_contract.frozen.json"
            --prior-h1-inventory "$track/results/run-33482595275/artifact/EXPLORATORY_FXCM_INVENTORY.json"
            --work-dir "$work"
            --report-dir "$mtf_report"
          )
          "${command[@]}"
          test -z "$(git status --porcelain)"

      - name: Calculate four independent Batch 6 candidate counts only
        shell: bash
        run: |
          set -euo pipefail
          track='research/phase9-exploratory-fxcm-20260901'
          command=(
            python "$track/runner/fxcm_blind_mtf_count_only_v6.py"
            --confirmation RUN_EXPLORATORY_FXCM_BLIND_MTF_BATCH6_COUNT_ONLY_2017_2018_V1
            --usage-confirmation I_CONFIRM_PERSONAL_NONCOMMERCIAL_USE_AND_ACCEPT_FXCM_EULA
            --contract "$track/spec/fxcm_blind_mtf_candidates_v6.frozen.json"
            --current-mtf-report "$PHASE9_BATCH6_COUNT_QC/EXPLORATORY_FXCM_MTF_QC.json"
            --work-dir "$PHASE9_BATCH6_COUNT_WORK"
            --report-dir "$PHASE9_BATCH6_COUNT_RESULT"
          )
          "${command[@]}"
          test -z "$(git status --porcelain)"

      - name: Destroy all working prices before upload
        if: ${{ always() && steps.acquire.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          work="${PHASE9_BATCH6_COUNT_WORK:-}"
          mtf_report="${PHASE9_BATCH6_COUNT_QC:-}"
          expected_work="$RUNNER_TEMP/phase9-batch6-count-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_mtf="$RUNNER_TEMP/phase9-batch6-count-qc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$work" = "$expected_work"
          test "$mtf_report" = "$expected_mtf"
          test ! -L "$work"
          test ! -L "$mtf_report"
          if [[ -d "$work" ]]; then
            find "$work" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf -- "$work"
          fi
          if [[ -d "$mtf_report" ]]; then
            rm -rf -- "$mtf_report"
          fi
          test ! -e "$work"
          test ! -e "$mtf_report"

      - name: Verify exact price-free Batch 6 Count-only artifact
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          report="$PHASE9_BATCH6_COUNT_RESULT"
          test "$report" = "$RUNNER_TEMP/phase9-batch6-count-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -L "$report"
          test "$(find "$report" -mindepth 1 -maxdepth 1 -type f | wc -l)" = '2'
          test -f "$report/EXPLORATORY_FXCM_BLIND_MTF_BATCH6_COUNT_ONLY.json"
          test -f "$report/artifact_manifest_sha256.txt"
          test -z "$(find "$report" -type f \( -iname '*.csv' -o -iname '*.gz' -o -iname '*.zip' \) -print -quit)"
          python - "$report/EXPLORATORY_FXCM_BLIND_MTF_BATCH6_COUNT_ONLY.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["status"] == "BLIND_MTF_BATCH6_COUNT_ONLY_COMPLETE_NO_OUTCOME"
          assert [row["strategy_id"] for row in value["strategy_results"]] == [
              "EXP-P9-MTF-321", "EXP-P9-MTF-322", "EXP-P9-MTF-323", "EXP-P9-MTF-324",
          ]
          assert value["candidate_signal_counts_calculated"] is True
          assert value["return_calculated"] is False
          assert value["research_outcomes_calculated"] is False
          assert value["outcome_fields"] == []
          assert value["persistent_price_files_after_cleanup"] == 0
          assert value["prior_candidate_rescue_performed"] is False
          assert value["result_dependent_rule_change"] is False
          assert value["prior_outcome_tested_candidate_count"] == 7
          assert value["future_cumulative_multiplicity_required"] is True
          PY
          cd "$report"
          sha256sum -c artifact_manifest_sha256.txt
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)"

      - name: Upload price-free Batch 6 Count-only metadata
        if: ${{ steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase9-exploratory-fxcm-blind-mtf-batch6-count-only-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PHASE9_BATCH6_COUNT_RESULT }}/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
