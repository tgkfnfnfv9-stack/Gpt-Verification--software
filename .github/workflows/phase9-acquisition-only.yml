name: phase9-acquisition-only

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD_PHASE9_JFOREX_PREFLIGHT_ONLY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase9-acquisition-only
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD_PHASE9_JFOREX_PREFLIGHT_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up pinned Java toolchain action
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '8'

      - name: Initialize runner temporary paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PLAN_OUTPUT_DIR=$RUNNER_TEMP/phase9-plan-output"
            echo "PLAN_CACHE_ROOT=$RUNNER_TEMP/phase9-plan-cache"
            echo "METADATA_DIR=$RUNNER_TEMP/phase9-metadata"
            echo "M2_REPO=$RUNNER_TEMP/phase9-m2"
            echo "MAVEN_USER_SETTINGS=$RUNNER_TEMP/phase9-maven-user-settings.xml"
            echo "MAVEN_GLOBAL_SETTINGS=$RUNNER_TEMP/phase9-maven-global-settings.xml"
          } >> "$GITHUB_ENV"

      - name: Record runtime identity before build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$METADATA_DIR"
          for settings in "$MAVEN_USER_SETTINGS" "$MAVEN_GLOBAL_SETTINGS"; do
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">' \
              '  <interactiveMode>false</interactiveMode>' \
              '  <offline>false</offline>' \
              '</settings>' > "$settings"
          done
          sha256sum "$MAVEN_USER_SETTINGS" "$MAVEN_GLOBAL_SETTINGS" \
            > "$METADATA_DIR/maven_settings_sha256.txt"
          {
            echo "git_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            java -version 2>&1
            mvn -version
          } > "$METADATA_DIR/runtime_identity.txt"

      - name: Verify frozen specification and acquisition-only source
        shell: bash
        run: |
          set -euo pipefail
          root='research/phase9-hypothesis-redesign-20260828'
          test "$(git hash-object "$root/spec/candidate_registry.frozen.json")" = '8740f58efe48c40ba0664606194b18b40cf14c27'
          test "$(git hash-object "$root/spec/data_requirements.frozen.json")" = '7e6a476366140e07edac4e4316f8c08a6ab4ae92'
          test "$(git hash-object "$root/policy/preregistered_research_policy.json")" = '8483418a6a75f5a6ea7d6b54ca54beb68896855f'
          test "$(git hash-object "$root/data_manifest/source_versions.json")" = 'feae561b2cb29a01baada265a32ea0cd36e93a86'
          test "$(git hash-object "$root/data_manifest/instrument_mapping.json")" = 'cb6622feaaa9e8b37e5ee47e82d70e1e0eebf2a3'
          test "$(git hash-object "$root/data_manifest/trading_calendar.json")" = 'fd77135fdb4e7599bf38de039f3cfc0f5f51c827'
          test "$(git hash-object "$root/data_manifest/energy_roll_rules.json")" = '9a40047e4498d87ccfe7cd4f1d0c903a9e4154cf'
          test "$(git hash-object "$root/runner/acquire_phase9_data.py")" = '3fb37bca9daad07e6a4ff4a612ccdc59b0ac2045'
          test "$(git hash-object "$root/runner/validate_phase9_acquisition.py")" = 'cb2d7acd6cf899e085301ac7e4a59b8e051a340b'
          test "$(git hash-object "$root/runner/jforex/pom.xml")" = 'd77481673c4e7817983f0ff11d3dc427e9524cb5'
          test "$(git hash-object "$root/runner/jforex/src/main/java/org/phase9/Phase9JForexAcquirer.java")" = '3464b6623d6c8fa71ba2fdb098b7bf6050219963'
          test "$(git hash-object "$root/runner/jforex/src/main/java/org/phase9/RuntimeClassOriginGuard.java")" = '86b873c42522f8f398a9826836a9a07af762dd2e'
          test "$(git hash-object "$root/runner/jforex/src/main/java/org/phase9/RuntimeClassOriginGuardSelfTest.java")" = '82bad437e91e132e400461a36049981eb431d36b'
          test "$(git hash-object "$root/tests/test_phase9_acquisition.py")" = '64b116173de9efb8d92e50728c75af26ce002b36'
          for manifest in source_versions instrument_mapping trading_calendar energy_roll_rules; do
            python -m json.tool "$root/data_manifest/${manifest}.json" >/dev/null
          done
          python -m unittest discover -s "$root/tests" -p 'test_phase9_acquisition.py' -v
          python "$root/runner/acquire_phase9_data.py" \
            --output-dir "$PLAN_OUTPUT_DIR" \
            --cache-root "$PLAN_CACHE_ROOT" \
            --jar "$RUNNER_TEMP/phase9-jforex-acquirer.jar" \
            --plan-only > "$RUNNER_TEMP/acquisition-plan.json"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["process_count"])' "$RUNNER_TEMP/acquisition-plan.json")" = 4
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["series_count"])' "$RUNNER_TEMP/acquisition-plan.json")" = 48
          test ! -e "$PLAN_OUTPUT_DIR"
          test ! -e "$PLAN_CACHE_ROOT"
          cp "$RUNNER_TEMP/acquisition-plan.json" "$METADATA_DIR/acquisition-plan.json"

      - name: Build pinned JForex acquisition client
        shell: bash
        run: |
          set -euo pipefail
          project='research/phase9-hypothesis-redesign-20260828/runner/jforex'
          unset MAVEN_ARGS MAVEN_OPTS
          test ! -e "$M2_REPO"
          mkdir -p "$M2_REPO"
          mvn -B -ntp -s "$MAVEN_USER_SETTINGS" -gs "$MAVEN_GLOBAL_SETTINGS" \
            -Dmaven.repo.local="$M2_REPO" -f "$project/pom.xml" clean package
          cp "$project/target/phase9-jforex-acquirer.jar" "$RUNNER_TEMP/phase9-jforex-acquirer-first.jar"
          root_repo="$M2_REPO/com/dukascopy/dds2/DDS2-jClient-JForex/3.6.51"
          echo 'daf2d98cded0a8ff85276965f0c10eb01692acff7949a5898ab295708e2c26c2  '"$root_repo/DDS2-jClient-JForex-3.6.51.jar" | sha256sum -c -
          echo 'ea80b6e0c938ca4831d723f29ec2ca311967788b00c6218c6768b91cbdb28bd9  '"$root_repo/DDS2-jClient-JForex-3.6.51.pom" | sha256sum -c -
          api_repo="$M2_REPO/com/dukascopy/api/JForex-API/2.13.99"
          echo 'bad5923eb37b07aaf3f8f257eec1cfec57d645c1f61ea68ec2b7e179d3736ac2  '"$api_repo/JForex-API-2.13.99.jar" | sha256sum -c -
          echo '3b66519706832fe4f29c6e0d42dc14b1882f02ffa5004d6af0287f73bbb1b04c  '"$api_repo/JForex-API-2.13.99.pom" | sha256sum -c -

      - name: Record isolated dependency identity
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$M2_REPO"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > "$METADATA_DIR/maven_repository_sha256.first.txt"
          sha256sum "$RUNNER_TEMP/phase9-jforex-acquirer-first.jar" \
            > "$METADATA_DIR/phase9_jforex_runner_sha256.first.txt"

      - name: Prove offline rebuild reproducibility
        shell: bash
        run: |
          set -euo pipefail
          project='research/phase9-hypothesis-redesign-20260828/runner/jforex'
          unset MAVEN_ARGS MAVEN_OPTS
          mvn -B -ntp -o -s "$MAVEN_USER_SETTINGS" -gs "$MAVEN_GLOBAL_SETTINGS" \
            -Dmaven.repo.local="$M2_REPO" -f "$project/pom.xml" clean package
          cp "$project/target/phase9-jforex-acquirer.jar" "$RUNNER_TEMP/phase9-jforex-acquirer-second.jar"
          (
            cd "$M2_REPO"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > "$METADATA_DIR/maven_repository_sha256.second.txt"
          cmp "$METADATA_DIR/maven_repository_sha256.first.txt" \
            "$METADATA_DIR/maven_repository_sha256.second.txt"
          mvn -B -ntp -o -s "$MAVEN_USER_SETTINGS" -gs "$MAVEN_GLOBAL_SETTINGS" \
            -Dmaven.repo.local="$M2_REPO" -f "$project/pom.xml" clean package
          cp "$project/target/phase9-jforex-acquirer.jar" "$RUNNER_TEMP/phase9-jforex-acquirer-third.jar"
          (
            cd "$M2_REPO"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > "$METADATA_DIR/maven_repository_sha256.third.txt"
          cmp "$METADATA_DIR/maven_repository_sha256.first.txt" \
            "$METADATA_DIR/maven_repository_sha256.third.txt"
          first_sha=$(sha256sum "$RUNNER_TEMP/phase9-jforex-acquirer-first.jar" | cut -d' ' -f1)
          second_sha=$(sha256sum "$RUNNER_TEMP/phase9-jforex-acquirer-second.jar" | cut -d' ' -f1)
          third_sha=$(sha256sum "$RUNNER_TEMP/phase9-jforex-acquirer-third.jar" | cut -d' ' -f1)
          test "$first_sha" = "$second_sha"
          test "$first_sha" = "$third_sha"
          printf '%s  phase9-jforex-acquirer.jar\n' "$third_sha" \
            > "$METADATA_DIR/phase9_jforex_runner_sha256.reproducible.txt"

      - name: Exercise class-origin guard without credentials or market access
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/phase9-jforex-acquirer-third.jar"
          positive_audit="$METADATA_DIR/class_origin_guard_positive.txt"
          negative_audit="$METADATA_DIR/class_origin_guard_negative.txt"
          manifest="$METADATA_DIR/runner_manifest.txt"
          unzip -p "$runner" META-INF/MANIFEST.MF | tr -d '\r' > "$manifest"
          grep -Fx 'Premain-Class: org.phase9.RuntimeClassOriginGuard' "$manifest"
          grep -Fx 'Main-Class: org.phase9.Phase9JForexAcquirer' "$manifest"
          test "$(grep -Ec '^(Class-Path|Boot-Class-Path):' "$manifest")" = 0
          test -z "$(unzip -Z1 "$runner" | LC_ALL=C sort | uniq -d | grep -E '\.class$' || true)"
          for injection in CLASSPATH JAVA_TOOL_OPTIONS _JAVA_OPTIONS JDK_JAVA_OPTIONS; do
            test -z "${!injection:-}"
          done

          set +e
          java -jar "$runner" > "$METADATA_DIR/no_agent_stdout.txt" \
            2> "$METADATA_DIR/no_agent_stderr.txt"
          no_agent_status=$?
          set -e
          test "$no_agent_status" -ne 0
          grep -F 'Phase 9 runtime class-origin guard is not active.' \
            "$METADATA_DIR/no_agent_stderr.txt"

          java "-javaagent:$runner=$positive_audit" \
            -cp "$runner" org.phase9.RuntimeClassOriginGuardSelfTest
          grep -Fx 'guard_status=ACTIVE' "$positive_audit"
          grep -Fx 'guard_status=PASSED' "$positive_audit"
          test "$(grep -Fc 'guard_status=REJECTED' "$positive_audit")" = 0

          probe="$RUNNER_TEMP/phase9-external-class-probe"
          mkdir -p "$probe/src/org/phase9/guardprobe" "$probe/classes"
          printf '%s\n' \
            'package org.phase9.guardprobe;' \
            'import java.nio.file.Files;' \
            'import java.nio.file.Paths;' \
            'public final class ExternalProbe {' \
            '  static { try { Files.write(Paths.get(System.getProperty("phase9.guardSentinel")), new byte[] {1}); } catch (Exception e) { throw new RuntimeException(e); } }' \
            '  public static void main(String[] args) {}' \
            '}' > "$probe/src/org/phase9/guardprobe/ExternalProbe.java"
          javac -source 8 -target 8 -d "$probe/classes" \
            "$probe/src/org/phase9/guardprobe/ExternalProbe.java"
          jar cf "$probe/external-probe.jar" -C "$probe/classes" .
          set +e
          java "-Dphase9.guardSentinel=$probe/sentinel" \
            "-javaagent:$runner=$negative_audit" \
            -cp "$runner:$probe/external-probe.jar" org.phase9.guardprobe.ExternalProbe
          guard_status=$?
          set -e
          test "$guard_status" = 86
          grep -Fx 'guard_status=REJECTED' "$negative_audit"
          grep -Fx 'rejected_class=org/phase9/guardprobe/ExternalProbe' "$negative_audit"
          test ! -e "$probe/sentinel"

      - name: Record preflight authorization state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = {
              "workflow_mode": "BUILD_PREFLIGHT_ONLY",
              "git_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "dukascopy_credentials_referenced": False,
              "market_price_request_attempted": False,
              "phase9_price_files_acquired": 0,
              "forbidden_market_period_request_attempted": False,
              "research_outcomes_calculated": False,
              "outcome_fields": [],
              "acquisition_authorized": False,
              "next_gate": "AUDIT_RUNTIME_GUARD_THEN_CLOSE_OS_NATIVE_JNLP_AND_FULL_QC_GAPS",
          }
          target = Path(os.environ["METADATA_DIR"]) / "preflight_authorization_state.json"
          target.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          test ! -e "$PLAN_OUTPUT_DIR"
          test ! -e "$PLAN_CACHE_ROOT"
          git diff --exit-code

      - name: Upload metadata only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase9-jforex-acquisition-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase9-metadata/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
