name: temp-gbpjpy-h1-v5
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Load V5 validator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp/gbpjpy-h1-v5
          git show FETCH_HEAD:.tmp/gbpjpy_h1_v5_exact.py > /tmp/v5.py
          python -m py_compile /tmp/v5.py
      - name: Install pinned dukascopy-go
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/Nosvemos/dukascopy-go/releases/download/v0.2.0/dukascopy-go_0.2.0_linux_amd64.tar.gz"
          curl -L --fail --retry 3 -o /tmp/d.tar.gz "$URL"
          echo "f78f621d747e7584be2ae6789f6b97e22ae656203cc9ab7a32766f699e455e4b  /tmp/d.tar.gz" | sha256sum -c -
          mkdir -p /tmp/d && tar -xzf /tmp/d.tar.gz -C /tmp/d
          BIN="$(find /tmp/d -type f -name dukascopy-go | head -1)"
          chmod +x "$BIN" && sudo install "$BIN" /usr/local/bin/dukascopy-go
      - name: Download exact 2y BID ASK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          dukascopy-go download --symbol GBPJPY --timeframe m15 --side bid --from 2024-08-27 --to 2026-08-27 --output data/GBPJPY_M15_bid.csv --engine jetta
          dukascopy-go download --symbol GBPJPY --timeframe m15 --side ask --from 2024-08-27 --to 2026-08-27 --output data/GBPJPY_M15_ask.csv --engine jetta
      - name: Run exact V5
        run: python /tmp/v5.py
      - name: Upload V5
        uses: actions/upload-artifact@v4
        with:
          name: gbpjpy-h1-v5-results
          path: results/
          if-no-files-found: error
          retention-days: 7
